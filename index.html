<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PRÓXIMO NÍVEL</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Próx. Nível">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ═══════ RESET & TOKENS ═══════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a12;--bg2:#0a1020;--surface:#111a2e;--surface2:#162035;
  --border:#1c2d4a;--border2:#243860;
  --blue:#3d8fff;--blue-dim:#1a4a8a;--blue-glow:rgba(61,143,255,.25);
  --gold:#e8c55a;--gold-dim:#7a6020;
  --green:#3dffb0;--green-dim:#1a5a40;
  --red:#ff4d6a;--red-dim:#5a1a25;
  --purple:#a87fff;--orange:#ff8c3d;
  --text:#c8d8ee;--text-dim:#6a85a8;--text-muted:#3a5070;
  --radius:10px;--radius-sm:6px;
  --font-title:'Cinzel',serif;--font-body:'Barlow Condensed',sans-serif;--font-mono:'Share Tech Mono',monospace;
  --nav-h:52px;--bottom-nav:60px;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
button{font-family:var(--font-body)}
input,select,textarea{font-family:var(--font-body)}

/* ═══════ CANVAS ═══════ */
#bg-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}

/* ═══════ LAYOUT ═══════ */
#root{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding-bottom:var(--bottom-nav)}

/* ═══════ HEADER ═══════ */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(6,10,18,.94);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 14px;height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.logo{font-family:var(--font-title);font-weight:900;font-size:13px;letter-spacing:4px;color:var(--text);text-transform:uppercase;white-space:nowrap}
.logo em{font-style:normal;color:var(--blue);text-shadow:0 0 18px var(--blue-glow)}
.header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hchip{font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:var(--radius-sm);border:1px solid;white-space:nowrap}
.hchip-xp{color:var(--blue);border-color:var(--blue-dim);background:rgba(61,143,255,.07)}
.hchip-coins{color:var(--gold);border-color:var(--gold-dim);background:rgba(232,197,90,.07)}
.header-rank{font-family:var(--font-title);font-size:13px;font-weight:700;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid;transition:all .3s;flex-shrink:0}

/* ═══════ BOTTOM NAV (mobile-first) ═══════ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(6,10,18,.96);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:flex;height:var(--bottom-nav);
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;color:var(--text-muted);cursor:pointer;
  font-family:var(--font-body);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  transition:color .2s;padding:0 2px;position:relative;
}
.bnav-btn.active{color:var(--blue)}
.bnav-btn .bnav-icon{font-size:18px;line-height:1}
.bnav-badge{
  position:absolute;top:6px;right:calc(50% - 18px);
  background:var(--red);color:#fff;border-radius:50%;
  width:14px;height:14px;font-size:8px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* Desktop: side nav instead of bottom nav */
@media(min-width:700px){
  #root{padding-bottom:0;flex-direction:column}
  .bottom-nav{display:none}
  .top-nav{display:flex}
}
.top-nav{
  display:none;
  gap:2px;padding:0 16px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.top-nav::-webkit-scrollbar{height:0}
.tnav-btn{
  font-family:var(--font-body);font-weight:600;font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-muted);background:none;border:none;
  border-bottom:2px solid transparent;padding:11px 14px;cursor:pointer;white-space:nowrap;transition:all .2s;
  position:relative;
}
.tnav-btn:hover{color:var(--text-dim)}
.tnav-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.tnav-btn .tbadge{
  display:inline-flex;align-items:center;justify-content:center;
  width:15px;height:15px;background:var(--red);color:#fff;
  border-radius:50%;font-size:8px;font-weight:700;margin-left:4px;vertical-align:middle;
}

/* ═══════ CONTENT ═══════ */
.content{flex:1;padding:14px;max-width:860px;width:100%;margin:0 auto}
@media(min-width:600px){.content{padding:20px}}

/* ═══════ PROFILE HERO ═══════ */
.profile-hero{
  background:linear-gradient(135deg,var(--surface) 0%,var(--bg2) 100%);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
}
.profile-hero::before{content:'';position:absolute;top:-40%;right:-5%;width:250px;height:250px;background:radial-gradient(circle,rgba(61,143,255,.06) 0%,transparent 70%);pointer-events:none}
.profile-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.avatar-wrap{position:relative;flex-shrink:0}
.avatar{
  width:68px;height:68px;border-radius:50%;background:var(--bg);
  border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-title);font-size:24px;font-weight:700;color:var(--blue);
  cursor:pointer;transition:all .3s;
}
.avatar:hover{border-color:var(--blue);transform:scale(1.05)}
.avatar-rank{
  position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-title);font-size:9px;font-weight:700;
  border:2px solid var(--bg);z-index:2;
}
.profile-meta{flex:1;min-width:0}
.profile-name{font-family:var(--font-title);font-size:18px;font-weight:700;color:#fff;margin-bottom:3px;cursor:pointer;line-height:1.2}
.profile-name:hover{color:var(--blue)}
.profile-title{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.profile-stats{display:flex;gap:16px;flex-wrap:wrap}
.pstat-val{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--blue);display:block}
.pstat-val.gold{color:var(--gold)}.pstat-val.purple{color:var(--purple)}
.pstat-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-top:1px}

/* XP Bar */
.xp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.xp-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim)}
.xp-pct{font-family:var(--font-mono);font-size:11px;color:var(--blue)}
.xp-track{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.xp-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue-dim),var(--blue));transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}
.xp-fill::after{content:'';position:absolute;top:0;right:0;width:20px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));animation:shimmer 1.5s infinite}
@keyframes shimmer{0%,100%{opacity:0}50%{opacity:1}}
.xp-sub{font-size:10px;color:var(--text-muted);margin-top:3px;text-align:right}

/* Ranks scroll row */
.ranks-scroll{overflow-x:auto;padding-bottom:4px;margin-top:14px}
.ranks-scroll::-webkit-scrollbar{height:3px}
.ranks-scroll::-webkit-scrollbar-thumb{background:var(--border2)}
.ranks-row{display:flex;gap:5px;min-width:max-content}
.rank-pip{
  text-align:center;padding:6px 8px 5px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg);
  opacity:.25;transition:all .3s;min-width:52px;
}
.rank-pip.unlocked{opacity:.6}
.rank-pip.current{opacity:1;border-color:currentColor;box-shadow:0 0 8px currentColor}
.rank-pip-letter{font-family:var(--font-title);font-size:13px;font-weight:700;display:block;margin-bottom:1px}
.rank-pip-name{font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);line-height:1.2}

/* ═══════ STATS GRID ═══════ */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:500px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;transition:border-color .2s}
.stat-card:hover{border-color:var(--border2)}
.stat-card-icon{font-size:18px;margin-bottom:4px;display:block}
.stat-card-val{font-family:var(--font-mono);font-size:18px;font-weight:700;display:block;margin-bottom:1px}
.stat-card-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}

/* ═══════ SECTION HEAD ═══════ */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-family:var(--font-title);font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim)}

/* ═══════ BUTTONS ═══════ */
.btn{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border:1px solid;border-radius:var(--radius-sm);padding:7px 14px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:rgba(61,143,255,.1);border-color:var(--blue-dim);color:var(--blue)}
.btn-primary:hover{background:rgba(61,143,255,.2);border-color:var(--blue)}
.btn-ghost{background:transparent;border-color:var(--border2);color:var(--text-dim)}
.btn-ghost:hover{border-color:var(--text-dim);color:var(--text)}
.btn-danger{background:rgba(255,77,106,.1);border-color:var(--red-dim);color:var(--red)}
.btn-gold{background:rgba(232,197,90,.1);border-color:var(--gold-dim);color:var(--gold)}
.btn-gold:hover{background:rgba(232,197,90,.2);border-color:var(--gold)}
.btn-sm{padding:5px 10px;font-size:10px}
.btn-icon{width:26px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:13px;background:transparent;border:1px solid var(--border);color:var(--text-muted);cursor:pointer;transition:all .2s;flex-shrink:0}
.btn-icon:hover{border-color:var(--red);color:var(--red)}

/* ═══════ MISSION CARDS ═══════ */
.mission-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 12px 12px 14px;margin-bottom:7px;
  display:flex;align-items:center;gap:10px;cursor:pointer;
  transition:all .2s;user-select:none;position:relative;overflow:hidden;
}
.mission-card:hover{border-color:var(--border2);transform:translateX(2px)}
.mission-card.done{opacity:.4}
.mission-card.done .mission-title{text-decoration:line-through}
.mission-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .25s}
.mission-card.done .mission-check{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.mission-info{flex:1;min-width:0}
.mission-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3}
.mission-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.diff-chip{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.reward-chip{font-family:var(--font-mono);font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px}
.type-chip{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);padding:1px 5px;border-radius:3px}

/* ═══════ HABITS ═══════ */
.habit-cols{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:520px){.habit-cols{grid-template-columns:1fr 1fr}}
.habit-col-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.habit-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:9px;
  cursor:pointer;transition:all .2s;user-select:none;
}
.habit-card:hover{border-color:var(--border2)}
.habit-card.checked-good{background:rgba(61,255,176,.05);border-color:var(--green-dim)}
.habit-card.checked-bad{background:rgba(255,77,106,.05);border-color:var(--red-dim)}
.habit-toggle{width:17px;height:17px;border-radius:4px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .2s}
.checked-good .habit-toggle{background:var(--green);border-color:var(--green);color:var(--bg)}
.checked-bad .habit-toggle{background:var(--red);border-color:var(--red);color:var(--bg)}
.habit-name{flex:1;font-size:13px;font-weight:500;color:var(--text)}
.habit-xp{font-family:var(--font-mono);font-size:11px;font-weight:600;white-space:nowrap}

/* ═══════ SHOP ═══════ */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:500px){.shop-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.shop-grid{grid-template-columns:repeat(4,1fr)}}
.shop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.shop-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.shop-card.cant-afford{opacity:.38}
.shop-icon{font-size:26px;line-height:1}
.shop-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.2}
.shop-cost{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--gold)}
.shop-cat{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)}

/* ═══════ HISTORY ═══════ */
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:5px;display:flex;align-items:center;gap:10px}
.history-icon{font-size:14px;flex-shrink:0}
.history-desc{flex:1;font-size:13px;color:var(--text-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-xp{font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap}
.history-date{font-size:9px;color:var(--text-muted);letter-spacing:.5px;white-space:nowrap}

/* ═══════ RANKS TABLE TAB ═══════ */
.ranks-table{width:100%;border-collapse:collapse}
.ranks-table th,.ranks-table td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:12px}
.ranks-table th{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);font-weight:600;background:var(--bg2)}
.ranks-table tr:hover td{background:rgba(255,255,255,.02)}
.rank-row-current td{background:rgba(61,143,255,.07)!important}
.rank-id-cell{font-family:var(--font-title);font-size:13px;font-weight:700}
.rank-name-cell{font-weight:500}
.rank-xp-cell{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}

/* ═══════ MODAL ═══════ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .15s ease}
@media(min-width:520px){.modal-overlay{align-items:center;padding:16px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;
  animation:slideUp .22s cubic-bezier(.4,0,.2,1);
}
@media(min-width:520px){.modal{border-radius:var(--radius)}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-family:var(--font-title);font-size:14px;font-weight:700;letter-spacing:2px;color:#fff;margin-bottom:18px;text-transform:uppercase}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-body);font-size:15px;padding:9px 11px;outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue)}
.form-textarea{min-height:55px;resize:vertical}
.diff-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.diff-pick-btn{padding:7px 3px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);font-family:var(--font-body);font-size:10px;font-weight:600;text-align:center;cursor:pointer;transition:all .2s;line-height:1.3}
.modal-actions{display:flex;gap:7px;margin-top:18px}

/* ═══════ TOAST ═══════ */
#toast-container{position:fixed;bottom:calc(var(--bottom-nav) + 10px);left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column-reverse;gap:7px;pointer-events:none}
@media(min-width:700px){#toast-container{bottom:20px}}
.toast{font-family:var(--font-body);font-size:13px;font-weight:600;padding:9px 18px;border-radius:var(--radius);border:1px solid;white-space:nowrap;animation:toastIn .3s ease forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}
.toast-xp{background:rgba(6,10,18,.97);border-color:var(--blue);color:var(--blue)}
.toast-coins{background:rgba(6,10,18,.97);border-color:var(--gold);color:var(--gold)}
.toast-bad{background:rgba(6,10,18,.97);border-color:var(--red);color:var(--red)}
.toast-rank{background:rgba(6,10,18,.97);border-color:var(--gold);color:var(--gold);font-size:15px}
.toast-ok{background:rgba(6,10,18,.97);border-color:var(--green);color:var(--green)}

/* ═══════ RANK UP FLASH ═══════ */
#rankup-flash{position:fixed;inset:0;z-index:500;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#rankup-flash.show{display:flex;animation:rankFlash 2s ease forwards}
@keyframes rankFlash{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
.rankup-bg{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(232,197,90,.12) 0%,transparent 65%)}
.rankup-text{font-family:var(--font-title);font-size:clamp(28px,8vw,54px);font-weight:900;letter-spacing:6px;text-transform:uppercase;text-align:center;position:relative;z-index:1;animation:rankPop .4s cubic-bezier(.4,0,.2,1) .2s both}
@keyframes rankPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.rankup-sub{font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--gold);position:relative;z-index:1}

/* ═══════ MISC ═══════ */
.empty-state{text-align:center;padding:36px 16px;color:var(--text-muted);font-size:13px}
.empty-state strong{display:block;font-size:22px;margin-bottom:5px;opacity:.25}

══════════════════════════════════════════════════════ */
let _syncUnsubscribe = null;
let _remoteSaving = false;  // flag para evitar loop write→snapshot→write

// Salva no Firestore (debounced 800ms para não bater a cota)
let _saveTimer = null;
function saveRemote(data) {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      _remoteSaving = true;
      await DOC_REF.set(data, { merge: false });
      _remoteSaving = false;
      showSyncDot('ok');
    } catch(e) {
      _remoteSaving = false;
      showSyncDot('err');
      console.warn('Firestore save error:', e);
    }
  }, 800);
}

// Escuta mudanças em tempo real (outro dispositivo salva → este atualiza)
function startSync() {
  showSyncDot('connecting');
  _syncUnsubscribe = DOC_REF.onSnapshot(snap => {
    if (_remoteSaving) return; // foi a gente que salvou, ignorar
    if (!snap.exists) return;  // doc ainda não existe
    const remote = snap.data();
    if (!remote) return;
    // Merge: dados remotos viram o novo state (preserva tab local)
    const currentTab = state.tab;
    state = { ...defaultState(), ...remote, tab: currentTab, modal: null };
    localStorage.setItem(KEY, JSON.stringify({ ...state, modal: null }));
    render();
    showSyncDot('ok');
  }, err => {
    showSyncDot('err');
    console.warn('Firestore listen error:', err);
  });
}

function stopSync() {
  if (_syncUnsubscribe) { _syncUnsubscribe(); _syncUnsubscribe = null; }
}

// Indicador visual de sync no header
function showSyncDot(status) {
  const dot = document.getElementById('sync-dot');
  if (!dot) return;
  const map = {
    connecting: { color: '#e8c55a', title: 'Conectando ao Firebase...' },
    ok:         { color: '#3dffb0', title: 'Sincronizado' },
    err:        { color: '#ff4d6a', title: 'Erro de sincronização (usando cache local)' },
    offline:    { color: '#6a85a8', title: 'Offline — usando cache local' },
  };
  const s = map[status] || map.offline;
  dot.style.background = s.color;
  dot.title = s.title;
  dot.style.boxShadow = `0 0 6px ${s.color}`;
}

let state = load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const s=JSON.parse(raw);const d=defaultState();return{...d,...s,player:{...d.player,...s.player},modal:null};}
  }catch(e){}
  return defaultState();
}
function save(){
  const data={...state,modal:null};
  localStorage.setItem(KEY,JSON.stringify(data));
  saveRemote(data);  // ← Firebase sync
}
function setState(patch,skipSave=false){state={...state,...patch};if(!skipSave)save();render()}

/* ══════════ HELPERS ══════════ */
function uid(){return Math.random().toString(36).slice(2,10)}
function getRank(xp){let r=RANKS[0];for(const rk of RANKS){if(xp>=rk.xpMin)r=rk;}return r}
function getXpProgress(xp){
  const r=getRank(xp);if(!r.xpNext)return 100;
  return Math.min(100,Math.round(((xp-r.xpMin)/(r.xpNext-r.xpMin))*100));
}
function getDiff(id){return DIFFS.find(d=>d.id===id)||DIFFS[0]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}

function fmtXP(n){
  if(n>=1e24) return(n/1e24).toFixed(1)+'Sp';
  if(n>=1e21) return(n/1e21).toFixed(1)+'Sx';
  if(n>=1e18) return(n/1e18).toFixed(1)+'Qi';
  if(n>=1e15) return(n/1e15).toFixed(1)+'Qa';
  if(n>=1e12) return(n/1e12).toFixed(1)+'T';
  if(n>=1e9)  return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)  return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)  return(n/1e3).toFixed(1)+'K';
  return String(Math.round(n));
}

/* ══════════ TOAST ══════════ */
function toast(msg,type='xp',dur=2500){
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;el.textContent=msg;
  document.getElementById('toast-container').prepend(el);
  setTimeout(()=>{el.style.animation='toastOut .3s ease forwards';setTimeout(()=>el.remove(),300)},dur);
}

/* ══════════ RANK UP ══════════ */
function checkRankUp(oldXp,newXp){
  const o=getRank(oldXp),n=getRank(newXp);
  if(n.id!==o.id)triggerRankUp(n);
}
function triggerRankUp(rank){
  const f=document.getElementById('rankup-flash');
  document.getElementById('rankup-letter').textContent=`RANK ${rank.id}`;
  document.getElementById('rankup-letter').style.color=rank.color;
  document.getElementById('rankup-name').textContent=rank.name;
  f.classList.add('show');
  toast(`⚡ RANK UP → ${rank.id} · ${rank.name}`,'rank',4000);
  setTimeout(()=>f.classList.remove('show'),2000);
}

/* ══════════ ACTIONS ══════════ */
function gainXP(amount,label,icon='⚔️'){
  const old=state.player.xp;
  const nw=Math.max(0,old+amount);
  state.player={...state.player,xp:nw};
  logHistory({icon,desc:label,xp:amount,ts:Date.now()});
  checkRankUp(old,nw);
  save();
  if(amount>0)toast(`+${fmtXP(amount)} XP — ${label}`,'xp');
  else toast(`${fmtXP(amount)} XP — ${label}`,'bad');
}
function gainCoins(amount,label){
  state.player={...state.player,coins:Math.max(0,state.player.coins+amount)};
  save();
  if(amount>0)toast(`+${amount} ⬡ — ${label}`,'coins');
}
function logHistory(entry){
  state.history=[entry,...state.history].slice(0,120);save();
}

function toggleMission(id){
  state.missions=state.missions.map(m=>{
    if(m.id!==id)return m;
    const d=getDiff(m.diff);
    if(!m.done){gainXP(d.xp,m.title,'⚔️');gainCoins(d.coins,m.title);return{...m,done:true};}
    else{gainXP(-d.xp,`(desfeito) ${m.title}`,'↩️');gainCoins(-d.coins,m.title);return{...m,done:false};}
  });
  setState({missions:state.missions});
}
function deleteMission(id){setState({missions:state.missions.filter(m=>m.id!==id)});toast('Missão removida','ok')}

function toggleHabit(type,id){
  const habits={...state.habits};
  habits[type]=habits[type].map(h=>{
    if(h.id!==id)return h;
    const xpVal=type==='good'?h.xp:-h.xp;
    if(!h.checked){
      gainXP(xpVal,h.name,type==='good'?'✦':'⚠️');
      if(type==='good')gainCoins(Math.floor(h.xp/10),h.name);
      return{...h,checked:true};
    }else{
      gainXP(-xpVal,`(desfeito) ${h.name}`,'↩️');
      if(type==='good')gainCoins(-Math.floor(h.xp/10),h.name);
      return{...h,checked:false};
    }
  });
  setState({habits});
}
function deleteHabit(type,id){const h={...state.habits};h[type]=h[type].filter(x=>x.id!==id);setState({habits:h})}

function buyItem(id){
  const item=state.shop.find(i=>i.id===id);
  if(!item||state.player.coins<item.cost)return;
  state.player={...state.player,coins:state.player.coins-item.cost};
  logHistory({icon:item.icon,desc:`Resgatou: ${item.name}`,xp:0,ts:Date.now()});
  save();render();
  toast(`${item.icon} "${item.name}" resgatado!`,'ok',3000);
}
function deleteShopItem(id){setState({shop:state.shop.filter(i=>i.id!==id)})}

function resetDay(){
  state.missions=state.missions.map(m=>m.type==='Diária'?{...m,done:false}:m);
  state.habits={good:state.habits.good.map(h=>({...h,checked:false})),bad:state.habits.bad.map(h=>({...h,checked:false}))};
  setState({missions:state.missions,habits:state.habits});
  toast('Dia reiniciado — bora!','ok');
}

/* ══════════ RENDER ══════════ */
function render(){
  const root=document.getElementById('root');
  if(!root)return;
  root.innerHTML=`
    ${renderHeader()}
    <nav class="top-nav">${renderNavBtns('tnav-btn')}</nav>
    <div class="content" id="tab-content">${renderTab()}</div>
    <div id="modal-area"></div>
    <nav class="bottom-nav">${renderNavBtns('bnav-btn')}</nav>
  `;
  attachListeners();
  renderModal();
  if(state.tab==='profile')requestAnimationFrame(()=>{
    setTimeout(()=>{const b=document.getElementById('xp-bar');if(b)b.style.width=getXpProgress(state.player.xp)+'%'},50);
  });
}

  const rank=getRank(state.player.xp);

      <span class="hchip hchip-xp">${fmtXP(state.player.xp)} XP</span>

      <div id="sync-dot" title="Sincronizando..." style="width:8px;height:8px;border-radius:50%;background:#6a85a8;flex-shrink:0;transition:all .4s"></div>

}

function renderNavBtns(cls){
  const pending=state.missions.filter(m=>!m.done).length;
  return NAV_ITEMS.map(t=>{
    const badge=t.id==='missions'&&pending?`<span class="bnav-badge">${pending}</span>`:'';
    if(cls==='bnav-btn')return`<button class="${cls} ${state.tab===t.id?'active':''}" data-tab="${t.id}">${badge}<span class="bnav-icon">${t.icon}</span>${esc(t.label)}</button>`;
    const tbadge=t.id==='missions'&&pending?`<span class="tbadge">${pending}</span>`:'';
    return`<button class="${cls} ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.icon} ${esc(t.label)}${tbadge}</button>`;
  }).join('');
}

function renderTab(){
  switch(state.tab){
    case'profile':  return tProfile();
    case'missions': return tMissions();
    case'habits':   return tHabits();
    case'shop':     return tShop();
    case'ranks':    return tRanks();
  }return'';
}

/* ── Profile ── */
function tProfile(){
  const {xp,coins,name}=state.player;
  const rank=getRank(xp);
  const prog=getXpProgress(xp);
  const nextRank=RANKS[RANKS.indexOf(rank)+1];
  const mDone=state.missions.filter(m=>m.done).length;
  const hDone=state.habits.good.filter(h=>h.checked).length;
  const todayXp=state.missions.filter(m=>m.done).reduce((a,m)=>a+getDiff(m.diff).xp,0)
               +state.habits.good.filter(h=>h.checked).reduce((a,h)=>a+h.xp,0)
               -state.habits.bad.filter(h=>h.checked).reduce((a,h)=>a+h.xp,0);

  const rankIdx=RANKS.indexOf(rank);
  const tierRanks=RANKS.filter(r=>r.tier===rank.tier);
  const visRanks=RANKS.slice(Math.max(0,rankIdx-2),Math.min(RANKS.length,rankIdx+8));

  return`
  <div class="profile-hero">
    <div class="profile-top">
      <div class="avatar-wrap">
        <div class="avatar" data-action="editName">${esc(name.charAt(0).toUpperCase())}</div>
        <div class="avatar-rank" style="background:${rank.color};color:#060a12">${rank.tier}</div>
      </div>
      <div class="profile-meta">
        <div class="profile-name" data-action="editName">${esc(name)}</div>
        <div class="profile-title" style="color:${rank.color}">${esc(rank.name)} · ${rank.id}</div>
        <div class="profile-stats">
          <div><span class="pstat-val">${fmtXP(xp)}</span><div class="pstat-label">XP Total</div></div>
          <div><span class="pstat-val gold">${coins.toLocaleString('pt-BR')}</span><div class="pstat-label">Coins</div></div>
          <div><span class="pstat-val purple">${mDone+hDone}</span><div class="pstat-label">Hoje</div></div>
        </div>
      </div>
    </div>
    <div class="xp-header">
      <span class="xp-label">→ ${nextRank?nextRank.id+' · '+nextRank.name:'RANK MÁXIMO'}</span>
      <span class="xp-pct">${prog}%</span>
    </div>
    <div class="xp-track"><div class="xp-fill" id="xp-bar" style="width:0%"></div></div>
    <div class="xp-sub">${nextRank?fmtXP(nextRank.xpMin-xp)+' XP restantes':'Você chegou ao topo!'}</div>
    <div class="ranks-scroll">
      <div class="ranks-row">
        ${visRanks.map(r=>{
          const unlocked=xp>=r.xpMin;
          const current=rank.id===r.id;
          return`<div class="rank-pip ${current?'current':unlocked?'unlocked':''}" style="color:${r.color}">
            <span class="rank-pip-letter">${r.id}</span>
            <div class="rank-pip-name">${r.name.split(' ')[0]}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><span class="stat-card-icon">⚔️</span><span class="stat-card-val" style="color:var(--blue)">${mDone}/${state.missions.length}</span><div class="stat-card-label">Missões hoje</div></div>
    <div class="stat-card"><span class="stat-card-icon">✦</span><span class="stat-card-val" style="color:var(--green)">${hDone}/${state.habits.good.length}</span><div class="stat-card-label">Hábitos bons</div></div>
    <div class="stat-card"><span class="stat-card-icon">📈</span><span class="stat-card-val" style="color:${todayXp>=0?'var(--green)':'var(--red)'}">${todayXp>=0?'+':''}${fmtXP(todayXp)}</span><div class="stat-card-label">XP de hoje</div></div>
    <div class="stat-card"><span class="stat-card-icon">🏆</span><span class="stat-card-val" style="color:var(--gold)">${state.history.length}</span><div class="stat-card-label">Ações totais</div></div>
  </div>

  <div class="section-head gap-top">
    <span class="section-title">Dia</span>
    <button class="btn btn-ghost btn-sm" data-action="resetDay">↺ Reiniciar dia</button>
  </div>

}

/* ── Missions ── */
function tMissions(){
  const active=state.missions.filter(m=>!m.done);
  const done=state.missions.filter(m=>m.done);
  return`
  <div class="section-head">
    <span class="section-title">Missões</span>
    <button class="btn btn-primary btn-sm" data-action="openMissionModal">+ Nova</button>
  </div>
  ${active.length===0?`<div class="empty-state"><strong>⚔️</strong>Nenhuma missão pendente.</div>`:''}
  ${active.map(mCard).join('')}
  ${done.length>0?`<div class="section-head gap-top"><span class="section-title">Concluídas</span></div>${done.map(mCard).join('')}`:''}
  `;
}
function mCard(m){

  return`<div class="mission-card ${m.done?'done':''}" data-mission-toggle="${m.id}">
    <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${d.color};border-radius:2px 0 0 2px;opacity:${m.done?.3:.8}"></div>

/* ── Ranks Table ── */
function tRanks(){
  const cur=getRank(state.player.xp);
  const TIER_COLORS={'E':'#6a85a8','D':'#3dffb0','C':'#3d8fff','B':'#a87fff','A':'#ff8c3d','S':'#e8c55a'};
  let lastTier='';
  return`
  <div class="section-head">
    <span class="section-title">55 Ranks</span>

/* ══════════ EVENT DELEGATION ══════════ */
function attachListeners(){
  document.addEventListener('click',handleClick,{once:true});
}
function handleClick(e){
  document.addEventListener('click',handleClick,{once:true});
  const t=e.target;

  const tab=t.closest('[data-tab]');
  if(tab&&(tab.closest('.bottom-nav')||tab.closest('.top-nav'))){setState({tab:tab.dataset.tab},true);render();return}

  const mt=t.closest('[data-mission-toggle]');
  if(mt&&!t.closest('[data-mission-delete]')){toggleMission(mt.dataset.missionToggle);return}
  const md=t.closest('[data-mission-delete]');
  if(md){e.stopPropagation();deleteMission(md.dataset.missionDelete);return}

  const ht=t.closest('[data-habit-toggle]');
  if(ht&&!t.closest('[data-habit-delete]')){const[ty,id]=ht.dataset.habitToggle.split(':');toggleHabit(ty,id);return}
  const hd=t.closest('[data-habit-delete]');
  if(hd){e.stopPropagation();const[ty,id]=hd.dataset.habitDelete.split(':');deleteHabit(ty,id);return}

  const sb=t.closest('[data-shop-buy]');if(sb){buyItem(sb.dataset.shopBuy);return}
  const sd=t.closest('[data-shop-delete]');if(sd){deleteShopItem(sd.dataset.shopDelete);return}

  const act=t.closest('[data-action]');
  if(act){
    const a=act.dataset.action;
    if(a==='openMissionModal')openModal('mission');
    else if(a==='openHabitModal')openModal('habit',{habitType:act.dataset.habitType});
    else if(a==='openShopModal')openModal('shop');
    else if(a==='editName')openModal('editName');
    else if(a==='resetDay')resetDay();
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.modal)closeModal();
  if(e.key==='Enter'&&state.modal){
    const ok=document.getElementById('mok');
    if(ok&&document.activeElement?.tagName!=='TEXTAREA')ok.click();
  }
});

/* ══════════ CANVAS PARTICLES ══════════ */
(function(){
  const cv=document.getElementById('bg-canvas'),ctx=cv.getContext('2d');
  let W,H,pts=[];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
  function mkpt(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,a:Math.random()*.45+.08,c:Math.random()>.7?'#3d8fff':'#1c2d4a'}}
  function init(){resize();pts=Array.from({length:50},mkpt)}
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const p of pts){
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c;ctx.globalAlpha=p.a;ctx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    }
    ctx.globalAlpha=1;requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  init();draw();
})();

// Captura evento de instalação e mostra botão no header
let _deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredInstall = e;
  // Mostra botão flutuante de instalação
  const btn = document.createElement('button');
  btn.id = 'pwa-install-btn';
  btn.innerHTML = '⬇ Instalar App';
  btn.style.cssText = `
    position:fixed;bottom:calc(var(--bottom-nav) + 12px);right:14px;z-index:300;
    font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;padding:9px 16px;border-radius:8px;cursor:pointer;
    background:#060a12;border:1px solid #3d8fff;color:#3d8fff;
    box-shadow:0 0 16px rgba(61,143,255,.3);animation:toastIn .3s ease;
  `;
  btn.addEventListener('click', async () => {
    if (!_deferredInstall) return;
    _deferredInstall.prompt();
    const { outcome } = await _deferredInstall.userChoice;
    if (outcome === 'accepted') btn.remove();
    _deferredInstall = null;
  });
  document.body.appendChild(btn);
});

// Remove botão quando já instalado
window.addEventListener('appinstalled', () => {
  document.getElementById('pwa-install-btn')?.remove();
  _deferredInstall = null;
  toast('App instalado com sucesso! 🎉', 'ok', 4000);
});
